name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Arch Linux)
    runs-on: ubuntu-latest
    # The target system: LXQt on Arch, with current GLib and GTK 4.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git
          glib2 glib2-devel libxml2 libarchive cairo pango gdk-pixbuf2 librsvg gtk4
          noto-fonts appstream desktop-file-utils

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate desktop entry and metainfo
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

      - name: Install
        run: DESTDIR="$PWD/pkg" cmake --install build
