[Theme]
Name=High Contrast
FormatVersion=1
Author=lxqt-personalizer
Comment=Maximum legibility: white on black with a bright cyan accent, thick borders, larger text and no transparency or animations.

[Scheme]
background=#000000
surface=#000000
foreground=#ffffff
accent=#1aebff
accent_text=#000000
title=#1aebff
panel=#000000
link=#ffff00
font=Noto Sans 11
title_font=Noto Sans Bold 11
style=kvantum
widget_radius=0
panel_style=underline
buttons=classic
title_align=left
title_padding=8
border_width=3
wallpaper=gradient
variant=false
wallpaper_seed=81

[Openbox]
title_layout=NLIMC
keep_border=yes

[LXQt]
tool_button_style=ToolButtonTextBesideIcon

[Panel]
position=Bottom
panelSize=40
iconSize=28
opacity=100
lineCount=1
width=100
width-percent=true
alignment=0
hidable=false
reserve-space=true

[Compositor]
corner_radius=0
shadow=false
blur=false
fading=false
inactive_opacity=1
animations=none
