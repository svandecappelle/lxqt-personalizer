[Theme]
Name=Solarized
FormatVersion=1
Author=lxqt-personalizer
Comment=Precise and low-glare: cream paper tones with a blue accent, gradient title bars and a gentle gradient wallpaper.

[Scheme]
background=#eee8d5
surface=#fdf6e3
foreground=#073642
accent=#268bd2
panel=#e4ddc8
link=#6c71c4
font=Noto Sans 10
title_font=Noto Sans Bold 10
style=kvantum
widget_radius=3
panel_style=underline
buttons=minimal
title_style=gradient
title_align=left
title_padding=6
border_width=1
wallpaper=gradient
variant=true
wallpaper_seed=61
ansi0=#073642
ansi1=#dc322f
ansi2=#859900
ansi3=#b58900
ansi4=#268bd2
ansi5=#d33682
ansi6=#2aa198
ansi7=#eee8d5

[Openbox]
title_layout=NLIMC
keep_border=yes

[LXQt]
tool_button_style=ToolButtonTextBesideIcon

[Panel]
position=Bottom
panelSize=34
iconSize=22
opacity=100
lineCount=1
width=100
width-percent=true
alignment=0
hidable=false
reserve-space=true

[Compositor]
corner_radius=4
shadow=true
shadow_radius=14
shadow_opacity=0.25
shadow_offset_x=-14
shadow_offset_y=-9
blur=false
fading=true
inactive_opacity=1
animations=subtle
