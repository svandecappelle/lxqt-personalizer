[Theme]
Name=Win11-like
FormatVersion=1
Author=lxqt-personalizer
Comment=Clean and light: a frosted taskbar, minimal window buttons with a red close, rounded windows and subtle animations.

[Scheme]
background=#f3f3f3
surface=#fbfbfb
foreground=#1b1b1b
accent=#0067c0
panel=#eeeeee
font=Noto Sans 10
title_font=Noto Sans 10
style=kvantum
widget_radius=4
panel_style=underline
buttons=minimal
title_align=left
title_padding=8
border_width=1
wallpaper=waves
variant=true
wallpaper_seed=21

[Openbox]
title_layout=NLIMC
keep_border=yes

[LXQt]
tool_button_style=ToolButtonTextBesideIcon

[Panel]
position=Bottom
panelSize=46
iconSize=24
lineCount=1
opacity=82
width=100
width-percent=true
alignment=0
hidable=false
reserve-space=true

[Compositor]
corner_radius=8
shadow=true
shadow_radius=18
shadow_opacity=0.28
shadow_offset_x=-18
shadow_offset_y=-12
blur=true
blur_strength=6
fading=true
inactive_opacity=1
animations=subtle
