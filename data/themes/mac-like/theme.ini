[Theme]
Name=Mac-like
FormatVersion=1
Author=lxqt-personalizer
Comment=Light and airy: a frosted top bar, colored window buttons on the left, soft deep shadows and smooth animations.

[Scheme]
background=#ececec
surface=#ffffff
foreground=#1d1d1f
accent=#0a84ff
panel=#f4f4f4
font=Noto Sans 10
title_font=Noto Sans Bold 10
style=kvantum
widget_radius=6
panel_style=flat
buttons=dots
title_align=center
title_padding=6
border_width=0
wallpaper=blobs
variant=true
wallpaper_seed=11

[Openbox]
title_layout=CIML
keep_border=no

[LXQt]
tool_button_style=ToolButtonIconOnly

[Panel]
position=Top
panelSize=28
iconSize=18
lineCount=1
opacity=72
width=100
width-percent=true
alignment=0
hidable=false
reserve-space=true

[Compositor]
corner_radius=12
shadow=true
shadow_radius=26
shadow_opacity=0.35
shadow_offset_x=-26
shadow_offset_y=-18
blur=true
blur_strength=7
fading=true
inactive_opacity=1
animations=smooth
