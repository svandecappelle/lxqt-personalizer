<?xml version="1.0" encoding="UTF-8"?>
<!-- Menu button of a generated LXQt theme: a launcher grid in the panel's colors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="{{panel_fg}}">
    <rect x="5" y="5" width="6" height="6" rx="1.8" fill="{{accent}}"/>
    <rect x="13" y="5" width="6" height="6" rx="1.8"/>
    <rect x="21" y="5" width="6" height="6" rx="1.8"/>
    <rect x="5" y="13" width="6" height="6" rx="1.8"/>
    <rect x="13" y="13" width="6" height="6" rx="1.8"/>
    <rect x="21" y="13" width="6" height="6" rx="1.8"/>
    <rect x="5" y="21" width="6" height="6" rx="1.8"/>
    <rect x="13" y="21" width="6" height="6" rx="1.8"/>
    <rect x="21" y="21" width="6" height="6" rx="1.8"/>
  </g>
</svg>
